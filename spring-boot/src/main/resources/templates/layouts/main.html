<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration — Spring Boot</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<div class="max-w-3xl mx-auto p-6">
    <header class="mb-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-semibold">Registration</h1>
            <span class="inline-block bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-1 rounded">
                Spring Boot 4
            </span>
        </div>
        <nav class="space-x-4 text-sm">
            <a href="/" class="text-blue-700 hover:underline">Form</a>
            <a href="/registrations" class="text-blue-700 hover:underline">List</a>
        </nav>
    </header>
    <main layout:fragment="content"></main>
    <footer class="mt-8 text-xs text-slate-400">
        Java <span th:text="${javaVersion}"></span> · PostgreSQL 18
    </footer>
</div>
</body>
</html>
